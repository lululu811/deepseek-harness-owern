<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="50" height="50">
  <!-- 小陈的工作室 favicon — 银渐层小猫 + CRT 终端 + 猫爪吊牌 (pixel asset).
       Deep-night-purple plate reads on both light and dark taskbars; fur
       silver is the fixed --dsw-static-silver scale, accents mirror the
       theme tokens verbatim (see ui-theme/styles/design-platform.css). -->
  <style>
    .bg { fill: #1c1622; }
    .frame { fill: none; stroke: #6b4f96; stroke-width: 2; }
    .fur-light { fill: #f8fafc; }
    .fur-mid { fill: #cbd5e1; }
    .fur-dark { fill: #94a3b8; }
    .fur-shadow { fill: #64748b; }
    .eye { fill: #4ac58a; }
    .gold { fill: #fbd38d; }
    .pink { fill: #ff7fa6; }
    .ink { fill: #1c1622; }
  </style>
  <rect x="1" y="1" width="30" height="30" class="bg"/>
  <rect x="2" y="2" width="28" height="28" class="frame"/>
  <!-- Ears: deep-silver shells, silver-light inner pixels. -->
  <path d="M6 5h4v5H6zM22 5h4v5h-4z" class="fur-dark"/>
  <path d="M7 7h2v3H7zM23 7h2v3h-2z" class="fur-light"/>
  <!-- Head with a dark fur-tip row and side shading. -->
  <path d="M8 9h16v12H8z" class="fur-light"/>
  <path d="M10 8h12v1H10z" class="fur-dark"/>
  <path d="M6 11h2v8H6zM24 11h2v8h-2z" class="fur-mid"/>
  <!-- Whiskers. -->
  <path d="M4 14h2v1H4zM26 14h2v1h-2z" class="fur-dark"/>
  <!-- Eyes: emerald with a honey-gold catchlight each. -->
  <path d="M10 12h3v4h-3zM19 12h3v4h-3z" class="eye"/>
  <path d="M10 12h1v1h-1zM19 12h1v1h-1z" class="gold"/>
  <!-- Nose and mouth. -->
  <path d="M15 15h2v1h-2z" class="pink"/>
  <path d="M14 17h4v1h-4z" class="fur-shadow"/>
  <!-- Pink collar. -->
  <path d="M9 21h14v2H9z" class="pink"/>
  <!-- Gold tag: pixel pawprint (three toes over one pad). -->
  <path d="M13 23h6v6h-6z" class="gold"/>
  <path d="M14 24h1v1h-1zM16 24h1v1h-1zM18 24h1v1h-1zM15 25h2v3h-2z" class="ink"/>
</svg>
